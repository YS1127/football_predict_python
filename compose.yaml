name: predict-football-python

# API 与调度器使用同一镜像，但保持一容器一个主进程。两者共享 MySQL，
# 并通过数据库 advisory lock 防止定时任务与 HTTP 手动任务重复执行。
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: predict-football:latest
    command:
      - python
      - -m
      - uvicorn
      - src.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - .env
    environment:
      # 三个容器加入同一外部网络后，直接使用 MySQL 容器名进行 Docker DNS 解析。
      DB_HOST: ${DOCKER_DB_HOST:-shiguang_mysql8}
      DB_PORT: ${DOCKER_DB_PORT:-3306}
    ports:
      - "${API_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shiguang-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: predict-football:latest
    command:
      - python
      - -m
      - src.main
      - scheduler
    env_file:
      - .env
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-shiguang_mysql8}
      DB_PORT: ${DOCKER_DB_PORT:-3306}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shiguang-network

# MySQL 已由另一套 Compose 管理，这里只引用它现有的网络，不创建或删除该网络。
networks:
  shiguang-network:
    external: true
    name: ${MYSQL_DOCKER_NETWORK:-docker-compose-files_shiguang-network}
